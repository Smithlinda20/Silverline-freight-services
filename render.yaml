services:
  - type: web
    name: silverline-freight-services
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py bootstrap_admin && gunicorn silverline_backend.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: TIME_ZONE
        value: America/New_York
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: new-silver
          property: connectionString
databases:
  - name: new-silver
    databaseName: new_silver_db
    user: new_silver_db_user